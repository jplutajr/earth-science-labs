name: Lab checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: lab-ci-only
          POSTGRES_DB: lab_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check model
        run: npm run test:model
      - name: Check teacher review rules and notebook compatibility
        run: npm run test:review
      - name: Check authentication client
        run: npm run test:auth
      - name: Check classroom database permissions
        env:
          PGPASSWORD: lab-ci-only
        run: |
          psql -h 127.0.0.1 -U postgres -d lab_ci -v ON_ERROR_STOP=1 -f backend/tests/bootstrap.sql
          psql -h 127.0.0.1 -U postgres -d lab_ci -v ON_ERROR_STOP=1 -f backend/001_classroom.sql
          psql -h 127.0.0.1 -U postgres -d lab_ci -v ON_ERROR_STOP=1 -f backend/tests/access.sql
      - name: Check student workflow and layout
        run: npm run test:browser
      - name: Verify public backend connection and anonymous access denial
        if: github.event_name == 'push'
        run: node tests/live-backend.cjs
      - name: Verify published GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node tests/live-site.cjs
      - name: Save browser review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: test-results/
          retention-days: 7
